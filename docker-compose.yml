services:
  api:
    build: .
    container_name: machinecare-api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/machinecare
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:?DEFAULT_USER_NAME must be set in .env}
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL:?DEFAULT_USER_EMAIL must be set in .env}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD must be set in .env}
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  mongo:
    image: mongo:latest
    container_name: machinecare-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: